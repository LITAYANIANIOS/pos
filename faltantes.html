<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Faltantes · Lita &amp; Añaños</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f6c445'/%3E%3Cpath d='M18 14h28v38H18z' fill='%23fff' stroke='%231f2a24' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M25 26h14M25 34h14M25 42h8' stroke='%231f2a24' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#f6c445">
<link rel="stylesheet" href="comun/estilos.css?v=1">
<style>
/* =====================================================================
   FALTANTES · DA BOX                                              v2.5
   Estilo Keep: una NOTA por sucursal con renglones (cantidad + producto). Tocar un renglón = qué hacer con él.
   📦 Reparto (Roman y Vivi): ve las notas de todas las sucursales y reparte.
   🛒 Compras (Joa): nota "Para pedir" (sumada y SIN sucursal) + notas propias por proveedor o tema. Tildar = agregado al pedido.
   ÍNDICE: 1. Estructura  2. Notas  3. Renglones  4. Menú del renglón  5. Aviso con deshacer
   ===================================================================== */
/* ---------- 1. Estructura ---------- */
body{font-size:15px;background:var(--bg)}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header.top .logo{padding:0;flex:1;min-width:0}
header.top .logo .emo{font-size:24px}
.rol{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent-soft)}
.ico{border:0;background:none;cursor:pointer;border-radius:50%;width:38px;height:38px;font-size:17px;color:var(--muted);display:grid;place-items:center}
.ico:hover{background:var(--sel);color:var(--ink)}
.wrap{max-width:1280px;margin:0 auto;padding:14px 16px 90px}
.quien{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-weight:600;font-size:14px}
.quien input{max-width:150px;padding:6px 10px}
.tips{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:0 2px 12px;flex-wrap:wrap}
.tips button{border:0;background:var(--surface-2);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer}
.tips button:hover{background:var(--sel)}
.info{color:var(--muted);font-size:12px;margin:18px 2px 0}
/* ---------- 2. Notas (columnas como Keep) ---------- */
.notas{columns:290px;column-gap:14px}
.nota{break-inside:avoid;margin:0 0 14px;border-radius:10px;padding:12px 6px 6px;background:var(--k-gris);border:1px solid transparent}
.nota[data-c="FALCON"]{background:var(--k-azul)} .nota[data-c="MORENO"]{background:var(--k-naranja)} .nota[data-c="NACION"]{background:var(--k-verde)}
.nota[data-c="SOMISA"]{background:var(--k-amarillo)} .nota[data-c="DEPOSITO"]{background:var(--k-violeta)} .nota[data-c="COMPRAS"]{background:var(--k-celeste)}
.nota[data-c="PEDIDOS"]{background:var(--surface);border-color:var(--line)}
.nota[data-c="L-amarillo"]{background:var(--k-amarillo)} .nota[data-c="L-naranja"]{background:var(--k-naranja)} .nota[data-c="L-rojo"]{background:var(--k-rojo)}
.nota[data-c="L-rosa"]{background:var(--k-rosa)} .nota[data-c="L-violeta"]{background:var(--k-violeta)} .nota[data-c="L-azul"]{background:var(--k-azul)}
.nota[data-c="L-celeste"]{background:var(--k-celeste)} .nota[data-c="L-verde"]{background:var(--k-verde)} .nota[data-c="L-gris"]{background:var(--k-gris)}
.nota.nueva{display:block;width:100%;border:2px dashed var(--line);background:none;color:var(--muted);font-weight:700;font-size:15px;padding:16px;cursor:pointer;text-align:left}
.nota.nueva small{display:block;font-weight:500;font-size:12.5px;margin-top:2px}
.nota.nueva:hover{color:var(--ink);border-color:var(--muted)}
.nota h2{font-size:17px;font-weight:600;margin:0 8px 6px;display:flex;align-items:center;gap:8px}
.nota h2 .n{font-size:12.5px;color:var(--muted);font-weight:600}
.nota h2 .ico{width:30px;height:30px;font-size:15px;margin-left:auto}
.nota .vacia{color:var(--muted);font-size:13.5px;padding:4px 8px 8px}
.agregar{display:flex;gap:6px;align-items:center;padding:4px 8px 6px;color:var(--muted)}
.agregar input{flex:1;min-width:0;border:0;background:transparent;padding:7px 2px;font-size:14.5px;color:var(--ink)}
.agregar input:focus{outline:none;border-bottom:1px solid var(--muted)}
.agregar input::placeholder{color:var(--muted)}
.hechos{border-top:1px solid rgb(0 0 0 / .08);margin:6px 8px 0;padding-top:4px}
.hechos summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;padding:4px 0;list-style:none}
.hechos summary::-webkit-details-marker{display:none}
/* ---------- 3. Renglones ---------- */
.ln{display:grid;grid-template-columns:22px auto minmax(0,1fr) auto;gap:8px;align-items:start;width:100%;border:0;background:none;text-align:left;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--ink);font-size:14.5px;line-height:1.35}
.ln:hover,.ln:focus-visible{background:rgb(0 0 0 / .05)}
.ln .e{font-size:14px;line-height:1.35;text-align:center}
.ln .e.libre{width:8px;height:8px;margin:7px auto 0;background:var(--muted);border-radius:50%;opacity:.55}   /* punto = sin repartir (no es una casilla) */
.ln .c{font-weight:800;font-variant-numeric:tabular-nums;min-width:22px}
.ln .c.nada{color:var(--bad)}
.ln .p{overflow-wrap:anywhere}
.ln .p small{display:block;color:var(--muted);font-size:12px}
.ln .a{font-size:12px;color:var(--warn);font-weight:700;white-space:nowrap}
.ln.hecho .p,.ln.hecho .c{text-decoration:line-through;color:var(--muted)}
.ln input[type=checkbox]{width:18px;height:18px;margin:1px 0 0;accent-color:var(--ok);cursor:pointer}
/* ---------- 4. Menú del renglón (abajo en el celular, al lado en la PC) ---------- */
.menu{position:fixed;inset:0;z-index:70;background:rgb(10 16 13 / .35);display:flex;align-items:flex-end;justify-content:center}
.menu .caja{background:var(--surface);width:100%;max-width:440px;border-radius:16px 16px 0 0;padding:16px 16px 20px;box-shadow:0 -10px 40px rgb(0 0 0 / .2)}
@media (min-width:700px){.menu{align-items:center}.menu .caja{border-radius:14px}}
.menu h3{margin:0;font-size:17px}
.menu .det{color:var(--muted);font-size:13px;margin:4px 0 12px}
.menu .det i{display:block;color:var(--ink);margin-top:4px}
.menu .ops{display:grid;gap:6px}
.menu .ops button{display:flex;gap:10px;align-items:center;border:0;background:var(--surface-2);border-radius:10px;padding:12px 14px;font-weight:600;font-size:15px;cursor:pointer;text-align:left;color:var(--ink)}
.menu .ops button:hover{background:var(--sel)}
.menu .ops button.mal{color:var(--bad)}
.campo-l{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:10px}
.fila-e{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}
.menu .det i{max-height:40vh;overflow:auto}
.menu .cerrar{margin-top:10px;width:100%;border:0;background:none;color:var(--muted);font-weight:600;padding:8px;cursor:pointer}
/* ---------- 5. Aviso con deshacer ---------- */
.deshacer{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgb(0 0 0 / .25);max-width:calc(100% - 24px)}
.deshacer button{border:0;background:none;color:var(--accent);font-weight:800;cursor:pointer;padding:4px 6px}
</style>
<script>
/* El link trae #s=<script>&t=<llave>. La llave se guarda en este celular y se borra de la barra (base.js borra el resto). */
(() => { const m = location.hash.match(/[#&]t=([\w-]{30,})/); if(m){ try{ localStorage.setItem("dabox.ftok", m[1]); }catch(e){} } })();
</script>
</head>
<body>
<div id="app" hidden>
<header class="top">
  <div class="logo"><i class="emo">📝</i><div>Faltantes<small>Lita &amp; Añaños</small></div></div>
  <span class="rol" id="rol"></span>
  <button class="ico" id="bAct" type="button" title="Actualizar">↻</button>
</header>
<div class="wrap">
  <div class="quien" id="quien" hidden>👋 ¿Quién sos? <input class="campo" id="qNom" maxlength="30" placeholder="Ej: Vivi"><button class="btn sm primary" id="qOk" type="button">Listo</button></div>
  <div class="tips" id="tips"></div>
  <div class="notas" id="notas"></div>
  <p class="info" id="info"></p>
</div>
</div>
<div class="menu" id="menu" hidden><div class="caja" role="dialog" aria-modal="true"><h3 id="mTit"></h3><div class="det" id="mDet"></div><div class="ops" id="mOps"></div><button class="cerrar" type="button" data-cerrar-menu>Cerrar</button></div></div>
<div class="menu" id="mEdit" hidden><form class="caja" id="fEdit" autocomplete="off">
  <h3>✏️ Editar renglón</h3>
  <label class="campo-l">Producto<input class="campo" id="eProd" maxlength="120"></label>
  <div class="fila-e"><label class="campo-l">Cantidad<input class="campo" id="eCant" inputmode="numeric"></label><label class="check" style="margin-top:22px"><input type="checkbox" id="eNada"> 🚫 No queda nada</label></div>
  <label class="campo-l">Sucursal<select class="campo" id="eSuc"></select></label>
  <label class="campo-l">Nota (opcional)<input class="campo" id="eObs" maxlength="200"></label>
  <div class="ops" style="grid-template-columns:1fr 1fr;margin-top:14px"><button type="button" id="eCancel">Cancelar</button><button type="submit" style="background:var(--accent);color:var(--accent-ink)">Guardar</button></div>
</form></div>
<div class="deshacer" id="deshacer" hidden><span id="dTxt"></span><button type="button" id="dBtn">Deshacer</button></div>

<!-- sin link ni clave -->
<div class="overlay" id="login" hidden>
  <form class="modal" id="fLogin" autocomplete="off">
    <div class="logo"><i class="emo">📝</i><div>Lita &amp; Añaños<small>Faltantes</small></div></div>
    <h2>🔒 Entrar</h2>
    <p class="note">Lo más fácil: abrí el <b>link de faltantes</b> que te pasó Roman (queda guardado en este celular). Si no, entrá con la clave del panel (encargado) o la de compras.</p>
    <label id="lUrl">Dirección de la planilla (Apps Script)<input class="campo" id="iUrl" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <label>Clave <input class="campo secreto" id="iClave" type="text" spellcheck="false" autocomplete="off"></label>
    <div class="err" id="lErr" hidden></div>
    <button class="btn primary" type="submit" style="width:100%;margin-top:18px;padding:12px">Entrar</button>
    <button class="link" id="bDemo" type="button">Ver con datos de prueba</button>
  </form>
</div>

<script src="comun/base.js?v=5"></script>
<script>
(()=>{
"use strict";
const {$, esc, norm, fechaAR, hace, leerLS, guardarLS, toast, SUCS, sucNom, LAPIZ, ERR} = LA;

/* =====================================================================
   1. CONEXIÓN: link secreto (t) guardado en el celular, o clave del panel (solo esta pestaña)
   ===================================================================== */
let url = leerLS("url", ""), tok = leerLS("ftok", ""), clave = (() => { try{ return sessionStorage.getItem("dabox.fclave") || ""; }catch(e){ return ""; } })();
let D = null, rol = "", demo = false, quien = leerLS("fquien", ""), tipsAbiertos = false;
async function api(accion, params = {}){
  if(demo) return demoApi(accion, params);
  LAPIZ(true);
  try{
    const u = new URL(url); u.search = new URLSearchParams({accion, ...(tok ? {t: tok} : {clave}), quien, ...params});
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 45000);
    let r; try{ r = await fetch(u, {cache:"no-store", signal:ctl.signal}); } finally{ clearTimeout(t); }
    if(!r.ok) throw "url";
    let j; try{ j = await r.json(); }catch(e){ throw "url"; }
    if(j.error === "clave incorrecta") throw "clave";
    if(j.error) throw {msg: j.error};
    return j;
  }catch(e){ throw e && e.msg ? e : (e === "clave" || e === "url") ? e : e && e.name === "AbortError" ? "tiempo" : navigator.onLine === false ? "internet" : "url"; }
  finally{ LAPIZ(false); }
}
const errTxt = e => e === "clave" ? "🔑 El link o la clave ya no sirven (¿se cambiaron?). Pedile a Roman el link nuevo." : ERR[e] || (e && e.msg) || "No se pudo conectar.";
async function cargar(){ D = await api("falt-ver"); rol = D.rol; render(); }
function entrar(){ $("#login").hidden = true; $("#app").hidden = false; render(); }
$("#fLogin").onsubmit = async e => {
  e.preventDefault();
  const u = $("#iUrl").value.trim(), c = $("#iClave").value.trim();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)){ $("#lErr").textContent = "La dirección tiene que ser la de Apps Script (termina en /exec)."; $("#lErr").hidden = false; return; }
  url = u; clave = c; tok = ""; demo = false;
  try{ await cargar(); guardarLS("url", url); try{ sessionStorage.setItem("dabox.fclave", clave); }catch(x){} entrar(); }
  catch(err){ $("#lErr").textContent = errTxt(err); $("#lErr").hidden = false; if(err !== "clave") $("#lUrl").hidden = false; }
};
$("#bDemo").onclick = () => { demo = true; D = demoApi("falt-ver"); rol = D.rol; entrar(); };
function mostrarLogin(msg){ $("#app").hidden = true; $("#login").hidden = false; $("#iUrl").value = url; $("#lUrl").hidden = !!url && !/dirección|script/i.test(msg || ""); $("#lErr").hidden = !msg;   /* si la dirección guardada falla, se puede corregir */ $("#lErr").textContent = msg || ""; }
async function inicio(){
  if(new URLSearchParams(location.search).has("demo")){ $("#bDemo").click(); return; }
  if(!url || (!tok && !clave)) return mostrarLogin();
  try{ await cargar(); entrar(); }
  catch(e){ if(e === "clave"){ tok = ""; guardarLS("ftok", ""); } mostrarLogin(errTxt(e)); }
}
$("#bAct").onclick = () => refrescar(true);
async function refrescar(avisar){
  if(demo){ D = demoApi("falt-ver"); render(); return; }
  try{ await cargar(); if(avisar) toast("Actualizado"); }catch(e){ toast(errTxt(e), 4000); }
}
const ocupado = () => !$("#menu").hidden || !$("#mEdit").hidden || document.activeElement.matches("input,textarea");
setInterval(() => { if(!document.hidden && !$("#app").hidden && !ocupado()) refrescar(false); }, 90000);
document.addEventListener("visibilitychange", () => { if(!document.hidden && D && Date.now() - D.generado > 60000 && !ocupado()) refrescar(false); });
$("#qOk").onclick = () => { const n = $("#qNom").value.trim(); if(n.length < 2) return; quien = n; guardarLS("fquien", n); $("#quien").hidden = true; toast("👋 Hola, " + n); };

/* =====================================================================
   2. ESTADOS, TIEMPOS Y TEXTOS
   ===================================================================== */
const EST = {"":["", "Sin repartir"], "Depósito":["📦","Sale del depósito"], "A pedir":["🛒","En compras"], "Pedido":["🚚","Pedido"],
             "No se consigue":["🔍","No se consigue"], "Entregado":["✓","Entregado"], "No se trae":["✖","No se trae"]};
const CERR = e => e === "Entregado" || e === "No se trae";
const DIA = 864e5, dias = ms => Math.floor((Date.now() - ms) / DIA);
const tsFecha = c => new Date((c.fecha || "") + "T12:00:00").getTime() || c.act;
const edad = c => c.estado === "" ? dias(tsFecha(c)) : dias(c.act || tsFecha(c));
const LIMITE = {"": 2, "Depósito": 3, "A pedir": 7, "Pedido": 10, "No se consigue": 0};     // días: después de esto, ⏰
const CONSEJO = {"": "Hace %d días sin repartir", "Depósito": "Salió del depósito hace %d días: ¿ya se llevó?", "A pedir": "Hace %d días en compras sin pedir",
                 "Pedido": "Pedido hace %d días: ¿llegó?", "No se consigue": "No se consigue: ¿reemplazo o ✖ no se trae?"};
const atrasado = c => !CERR(c.estado) && LIMITE[c.estado] != null && edad(c) >= LIMITE[c.estado];
const VER_HECHOS = 3;                                                     // días que quedan tachados en la nota
const cantTxt = c => c.nada ? `<span class="c nada" title="No queda nada">🚫</span>` : `<span class="c">${c.cant || "?"}</span>`;
const clave2 = s => norm(s).replace(/[^a-z0-9 ]+/g, " ").split(/\s+/).filter(w => w && !["de","x","para","el","la","los","las","con","y","u","unidades"].includes(w)).map(w => w.replace(/(es|s)$/, "")).sort().join(" ");
const parseCant = t => { const m = t.match(/^\s*(\d+)\s*[*xX×]?\s+(.+)$/) || t.match(/^\s*(\d+)\s*[*xX×]\s*(.+)$/); return m ? {cant:+m[1], nada:+m[1] === 0, txt:m[2].trim()} : {cant:0, nada:false, txt:t.trim()}; };

/* =====================================================================
   3. DIBUJAR
   ===================================================================== */
function render(){
  if(!D) return;
  $("#rol").textContent = rol === "compras" ? "🛒 Compras" : rol === "anotar" ? "📝 Anotar" : "📦 Reparto";
  $("#quien").hidden = !!quien || demo;
  $("#info").textContent = `${demo ? "🎓 Datos de prueba · " : ""}Actualizado ${hace(D.generado)}. ${rol === "anotar" ? "Escribí en ＋ Agregar de cada sucursal (ej: 3 lupas) o pegá una lista entera. Roman reparte." : "Tocá un renglón para moverlo."}`;
  if(rol === "compras") renderCompras(); else renderReparto();
}
/* ---------- 📦 REPARTO: una nota por sucursal ---------- */
let PROPS = [], filtro = null;
function renderReparto(){
  const cs = D.cards || [], abiertos = cs.filter(c => !CERR(c.estado));
  $("#tips").innerHTML = rol === "anotar" ? "" : tipsReparto(abiertos);
  const notas = SUCS.map(s => {
    const mias = cs.filter(c => c.suc === s), ab = mias.filter(c => !CERR(c.estado) && (!filtro || filtro.f(c)));
    const hechos = mias.filter(c => CERR(c.estado) && dias(c.act) < VER_HECHOS);
    if(filtro && !ab.length) return "";
    const orden = (a,b) => (a.estado === "" ? 0 : 1) - (b.estado === "" ? 0 : 1) || (b.nada - a.nada) || (edad(b) - edad(a));
    const nuevos = ab.filter(c => c.estado === "").length;
    return `<section class="nota" data-c="${s}" data-suc="${s}"><h2>${esc(sucNom(s))} <span class="n">${ab.length || ""}</span>${nuevos > 1 && rol !== "anotar" ? `<button class="ico" type="button" data-todo="${s}" title="Pasar todo lo nuevo a compras">⋯</button>` : ""}</h2>
      ${ab.sort(orden).map(renglon).join("") || (filtro ? "" : `<div class="vacia">Nada pendiente 🎉</div>`)}
      ${filtro ? "" : `<label class="agregar">＋<input data-agregar="${s}" maxlength="120" placeholder="Agregar… (ej: 3 lupas)" enterkeyhint="done"></label>`}
      ${hechos.length && !filtro ? `<details class="hechos"><summary>✓ ${hechos.length} cerrado${hechos.length > 1 ? "s" : ""}</summary>${hechos.map(renglon).join("")}</details>` : ""}</section>`;
  }).join("");
  $("#notas").innerHTML = notas || `<div class="empty">Nada con ese filtro.</div>`;
}
function renglon(c){
  const e = EST[c.estado] || EST[""], at = atrasado(c);
  return `<button class="ln${CERR(c.estado) ? " hecho" : ""}" type="button" data-id="${esc(c.id)}">
    ${c.estado === "" ? `<span class="e libre" title="Sin repartir"></span>` : `<span class="e" title="${e[1]}">${e[0]}</span>`}${cantTxt(c)}
    <span class="p">${esc(c.prod)}${c.obs ? `<small>“${esc(c.obs)}”</small>` : ""}</span>${at ? `<span class="a" title="${esc(CONSEJO[c.estado].replace("%d", edad(c)))}">⏰ ${edad(c)}d</span>` : `<span></span>`}</button>`;
}
/* 💡 lo trabado, en una línea: tocar = filtrar */
function tipsReparto(ab){
  const P = [], fx = (t, f) => P.push({t, f});
  const sin = ab.filter(c => c.estado === "" && edad(c) >= LIMITE[""]).length; if(sin) fx(`📥 ${sin} sin repartir`, c => c.estado === "" && edad(c) >= LIMITE[""]);
  const g = {}; ab.forEach(c => { const k = clave2(c.prod); (g[k] = g[k] || []).push(c); });
  Object.values(g).filter(x => new Set(x.map(c => c.suc)).size >= 2).slice(0, 2).forEach(x => { const k = clave2(x[0].prod);
    fx(`👥 “${x[0].prod}” en ${new Set(x.map(c => c.suc)).size} sucursales`, c => clave2(c.prod) === k); });
  [["Depósito","📦 depósito atrasado"],["A pedir","🛒 compras atrasado"],["Pedido","🚚 pedidos sin llegar"],["No se consigue","🔍 no se consiguen"]].forEach(([e, t]) => {
    const n = ab.filter(c => c.estado === e && atrasado(c)).length; if(n) fx(`${n} ${t}`, c => c.estado === e && atrasado(c)); });
  PROPS = P;
  if(filtro) return `<span>🔎 ${esc(filtro.t)}</span><button type="button" data-sinfiltro>✕ Ver todo</button>`;
  return P.length ? `<span>💡</span>` + P.map((p, i) => `<button type="button" data-p="${i}">${esc(p.t)}</button>`).join("") : "";
}

function tipsCompras(l){
  const P = [], by = {};
  l.forEach(g => { const k = (g.lista || "") + "~" + clave2(g.nombre); (by[k] = by[k] || []).push(g); });
  const pares = Object.values(by).filter(x => x.length > 1);
  const W = l.slice(0, 200).map(g => [g, new Set(clave2(g.nombre).split(" ").filter(w => w.length > 1))]);   // "resma ledesma" ⊂ "resma a4 ledesma 75g"
  W.forEach(([a, wa], i) => W.slice(i + 1).forEach(([b, wb]) => { const [ch, gr] = wa.size <= wb.size ? [wa, wb] : [wb, wa];
    if((a.lista || "") === (b.lista || "") && ch.size >= 2 && ch.size < gr.size && [...ch].every(w => gr.has(w))) pares.push([a, b]); }));
  pares.slice(0, 3).forEach(x => P.push({t:`🔗 ¿Es lo mismo? ${x.map(g => g.nombre).join(" = ")}`, unir:x}));
  PROPS = P;
  return P.length ? `<span>💡</span>` + P.map((p, i) => `<button type="button" data-p="${i}" title="Tocá para unirlos">${esc(p.t)}</button>`).join("") : "";
}

/* ＋ Agregar: una línea o MUCHAS pegadas de una (una nota entera de Keep). "3 lupas" = 3; "- " o "☐" adelante se saca; fechas sueltas (2/11) se saltean */
const limpiarLinea = t => t.replace(/^[\s\-–—•·☐☑✓✔*]+/, "").replace(/[.\s]+$/, "").trim();
const TITULOS = /^(enero|febrero|marzo|abril|mayo|junio|julio|agosto|sep?tiembre|o[ck]tubre|noviembre|diciembre|pendientes?|faltantes?|urgente)\s*:?$/i;   // títulos de Keep: no son productos
const lineasDe = txt => String(txt).split(/\r?\n/).map(limpiarLinea).filter(t => t.length > 1 && !/^\d{1,2}\/\d{1,2}(\/\d{2,4})?$/.test(t) && !TITULOS.test(t));
async function agregar(suc, inp, pegado){
  const ls = pegado ? lineasDe(pegado) : lineasDe(inp.value); if(!ls.length) return;
  const grupos = {}; ls.forEach(t => { const {cant, nada, txt} = parseCant(t); const k = nada ? "nada" : String(cant || ""); (grupos[k] = grupos[k] || []).push(txt); });
  inp.disabled = true;
  try{
    for(const [k, l] of Object.entries(grupos)) for(let i = 0; i < l.length; i += 30)
      await api("falt-nuevo", {sucursal:suc, texto:l.slice(i, i + 30).join("\n"), ...(k === "nada" ? {nada:"1"} : {cant:k})});
    inp.value = ""; await refrescar(false);
    const nuevo = $(`input[data-agregar="${suc}"]`); if(nuevo) nuevo.focus();
    const sinCant = (grupos[""] || []).length;
    toast(ls.length > 1 ? `📝 ${ls.length} renglones agregados a ${sucNom(suc)}${sinCant ? ` (${sinCant} sin cantidad: tocalos para completarla)` : ""}` : sinCant ? "Anotado sin cantidad: la próxima, poné el número adelante (3 lupas)" : "📝 Anotado", 4000);
  }catch(e){ toast(errTxt(e), 4000); }
  finally{ inp.disabled = false; }
}

  const t = (e.clipboardData || window.clipboardData).getData("text"); if(!/\n/.test(t.trim())) return;   // una sola línea: se pega normal
