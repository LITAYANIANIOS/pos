   v2.2: 🏷️ Precios (Encargado y Dueño): buscar un producto del Catálogo y cambiar precio o combo ahí mismo. Acepta cuentas

   v2.0: Ventas → Ventas / Ingresos (sin cta. cte. + pagos de cta. cte.), filtro por medio de pago, 📅 rango Desde/Hasta,

<body>
<div class="app" id="app" hidden>
<aside>
  <div class="logo"><i class="emo">📊</i><div>Lita &amp; Añaños<small id="sRol">Panel</small></div></div>
  <nav id="nav" role="tablist" aria-label="Secciones"></nav>
  <div class="pie"><span id="sAct"></span><button id="bTema" type="button" class="tema">🌙 Modo oscuro</button><button id="bSalir">↩ Salir</button></div>
</aside>
<main>
  <div class="top"><h1 id="titulo"></h1></div>
  <div class="aviso" id="aviso" hidden></div>
  <div class="filtros">
    <div class="seg" id="fDias" aria-label="Período"></div>
    <span id="fRango" hidden><input type="date" class="campo" id="rD" aria-label="Desde"> a <input type="date" class="campo" id="rH" aria-label="Hasta"><button class="btn sm" id="rOk" type="button">Ver</button></span>
    <div class="seg" id="fSuc" aria-label="Sucursal"></div>
    <div class="der"><button class="btn sm" id="bAct">↻ Actualizar</button></div>
  </div>
  <section id="s-vivo" hidden></section>
  <section id="s-ventas" hidden></section>
  <section id="s-mensual" hidden></section>
  <section id="s-cierres" hidden></section>
  <section id="s-sobres" hidden></section>
  <section id="s-cobros" hidden></section>
  <section id="s-control" hidden></section>
  <section id="s-productos" hidden></section>
  <section id="s-precios" hidden></section>
  <section id="s-falt" hidden></section>
  <section id="s-prov" hidden></section>
</main>
</div>

<script src="comun/base.js?v=7"></script>
<script>
(()=>{
"use strict";
const {$, esc, money, millones, pct, pad, ymd, fechaAR, norm, hace, leerLS, guardarLS, SUCS, SUC_COLOR, sucNom, sucTag} = LA;

/* =====================================================================
   1. CONFIGURACIÓN
   ===================================================================== */
const SECCIONES = {vivo:["🟢","En vivo"], ventas:["📈","Ventas"], mensual:["📅","Meses"], cierres:["💵","Cierres"], sobres:["💰","Sobres"], cobros:["💳","Cobros"], control:["🔍","Control"], productos:["📦","Productos"], precios:["🏷️","Precios"], falt:["📝","Faltantes"], prov:["💲","Proveedores"]};
const ROLES = {admin:"Encargado", dueno:"Dueño", compras:"Compras"};
const CON_COMPRAS = ["admin","compras"];                    // roles que ven el link al tablero de compras
const PERIODOS = [[1,"Hoy"],[7,"7 días"],[30,"30 días"],[90,"90 días"],[365,"1 año"]];
const enPer = () => rango ? `del ${fechaAR(rango[0])} al ${fechaAR(rango[1])}` : dias === 1 ? "hoy" : `en ${dias} días`;   // texto del período elegido
const unDia = () => rango ? rango[0] === rango[1] : dias === 1;
const MEDIOS = {efectivo:"💵 Efectivo", postnet:"💳 Postnet / QR", transf:"🏦 Transferencia", ctacte:"📒 Cta. cte."};
const DIAS_SEM = ["","Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const mesTxt = m => MESES[+m.slice(5,7)-1] + " " + m.slice(2,4);
const PRECIO_ABIERTO = new Set(["FOTO","LIB","VAR","SUBE"]);  // categorías de la caja con precio libre
const DIF_MINIMA = 1000;                                     // desde cuánto una diferencia de cierre se marca
const MIN_SEÑAL = 3;                                         // la caja avisa cada minuto: más de esto = sin señal
const REFRESCO_MIN = 5;                                      // se actualiza solo cada tantos minutos (pestaña visible)

/* =====================================================================
   2. DATOS, NAVEGACIÓN Y FILTROS
   ===================================================================== */
let D = null, dias = +leerLS("dias", 30) || 30, suc = "TODAS", tab = null, cargando = false, rango = null;   // rango: [desde, hasta] (yyyy-mm-dd) o null
const cargar = () => LA.api("panel", rango ? {dias, desde:rango[0], hasta:rango[1]} : {dias});
async function actualizar(){
  if(cargando) return; cargando = true; $("#bAct").textContent = "Cargando…";
  try{ D = LA.demo ? datosDemo() : await cargar(); $("#aviso").textContent = AVISO_DEMO; $("#aviso").hidden = !LA.demo; armarNav(); render(); }
  catch(e){ if(e === "clave"){ LA.salir(LA.ERR.clave); return; } $("#aviso").hidden = false; $("#aviso").textContent = (LA.ERR[e] || "No se pudo cargar.") + " Se muestran los últimos datos."; }
  finally{ cargando = false; $("#bAct").textContent = "↻ Actualizar"; }
}
function armarNav(){
  const secs = D.secciones.filter(s => SECCIONES[s]);
  if(["admin","dueno"].includes(D.rol) && !secs.includes("precios")) secs.push("precios");   // cambiar precios: la planilla vuelve a pedir la clave en cada cambio
  if(CON_COMPRAS.includes(D.rol)) secs.push("prov");                                        // v2.13: 📝 Faltantes se abre en otra pestaña (botón en la barra)                                  // se abren acá adentro con la misma clave (faltantes.html y proveedores.html)
  if(D.rol === "compras"){ secs.sort((a, b) => (a === "productos") - (b === "productos")); if(!tab) tab = "prov"; }   // Joa arranca en Faltantes
  if(!secs.includes(tab)) tab = secs[0];
  $("#nav").innerHTML = secs.map(s => `<button role="tab" data-s="${s}" aria-selected="${s===tab}"><i class="emo">${SECCIONES[s][0]}</i>${SECCIONES[s][1]}</button>`).join("")
    + (CON_COMPRAS.includes(D.rol) ? `<button type="button" id="bFalt" title="Abre Faltantes en otra pestaña (con la misma clave)"><i class="emo">📝</i>Faltantes ↗</button>` : "");
  $("#sRol").textContent = "Panel · " + (ROLES[D.rol] || D.rol);
}
$("#nav").addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return;
  if(b.id === "bFalt"){ window.open("faltantes.html" + (LA.demo ? "?demo" : ""), "dabox-faltantes"); return; }   // v2.13: siempre la misma pestaña (no abre 10)
  tab = b.dataset.s; armarNav(); render(); });
$("#s-vivo").addEventListener("click", e => { if(e.target.id === "vIrCierres"){ tab = "cierres"; armarNav(); render(); } });
function renderFiltros(){
  $("#fDias").innerHTML = PERIODOS.map(([d,l]) => `<button data-d="${d}" aria-pressed="${!rango && d===dias}">${l}</button>`).join("") + `<button data-d="r" aria-pressed="${!!rango}" title="Elegir fechas">📅 ${rango ? enPer().slice(4) : "Fechas"}</button>`;
  $("#fSuc").innerHTML = ["TODAS", ...SUCS].map(s => `<button data-s="${s}" aria-pressed="${s===suc}">${s==="TODAS" ? "Todas" : `<i class="dot" style="background:${SUC_COLOR[s]}"></i>${sucNom(s)}`}</button>`).join("");
  $("#fDias").hidden = ["vivo","mensual","cobros","sobres","precios","falt","prov"].includes(tab); if($("#fDias").hidden) $("#fRango").hidden = true;         // esas secciones no dependen del período
  $("#fSuc").hidden = tab === "vivo" || tab === "precios";
  document.querySelector("main > .filtros").hidden = ["precios","falt","prov"].includes(tab);
}
$("#fDias").addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.d === "r"){ const f = $("#fRango"); f.hidden = !f.hidden; if(!f.hidden){ const r = rango || (D && D.r) || [ymd(new Date()), ymd(new Date())]; $("#rD").value = r[0]; $("#rH").value = r[1]; $("#rD").focus(); } return; }
  rango = null; $("#fRango").hidden = true; dias = +b.dataset.d; guardarLS("dias", dias); actualizar(); });
$("#rOk").onclick = () => { const d = $("#rD").value, h = $("#rH").value;
  if(!d || !h || d > h) return LA.toast("Elegí Desde y Hasta (Desde antes que Hasta)");
  rango = [d, h]; $("#fRango").hidden = true; actualizar(); };
$("#fSuc").addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return; suc = b.dataset.s; render(); });
$("#bAct").onclick = actualizar;
$("#bSalir").onclick = () => LA.salir();
/* v2.10 · ☀️/🌙: una sola elección por PC (la comparten faltantes y proveedores, incluso adentro del panel) */
const esOscuro = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
const pintarTema = () => { $("#bTema").textContent = esOscuro() ? "☀️ Modo claro" : "🌙 Modo oscuro"; };
$("#bTema").onclick = () => { const nuevo = esOscuro() ? "claro" : "oscuro"; document.documentElement.dataset.theme = nuevo === "claro" ? "light" : "dark"; try{ localStorage.setItem("dabox.tema", nuevo); }catch(e){} pintarTema(); };
pintarTema();
/* si se cambia ☀️/🌙 en otra pestaña o en el panel, esta página lo sigue al instante */
addEventListener("storage", e => { if(e.key !== "dabox.tema") return; const t = e.newValue; if(t === "claro" || t === "oscuro") document.documentElement.dataset.theme = t === "claro" ? "light" : "dark"; else delete document.documentElement.dataset.theme; if(typeof pintarTema === "function") pintarTema(); });
setInterval(() => { if(D && !document.hidden && !$("#app").hidden && !sbAbierto && !["precios","falt","prov"].includes(tab)) actualizar(); }, REFRESCO_MIN*60000);   // en Precios no se redibuja (no se pierde lo escrito)   // no refresca con un sobre a medio cargar
const deSuc = s => suc === "TODAS" || s === suc;

function render(){
  if(!D) return;
  renderFiltros();
  Object.keys(SECCIONES).forEach(s => $("#s-"+s).hidden = s !== tab);
  $("#titulo").innerHTML = `<i class="emo">${SECCIONES[tab][0]}</i>${SECCIONES[tab][1]}`;
  $("#sAct").textContent = "Actualizado " + new Date(D.generado).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  ({vivo:rVivo, ventas:rVentas, mensual:rMensual, cierres:rCierres, sobres:rSobres, cobros:rCobros, control:rControl, productos:rProductos, precios:rPrecios, falt:() => rEmbebido("falt"), prov:() => rEmbebido("prov")})[tab]();
}
/* 📝 💲 adentro del panel: la página se carga una sola vez (no se pierde lo escrito al cambiar de sección) y usa la clave del panel */
function rEmbebido(s){
  const S = $("#s-" + s); if(S.firstChild) return;
  S.innerHTML = `<iframe class="embebido" title="${SECCIONES[s][1]}" src="${s === "falt" ? "faltantes.html?embed" + (LA.demo ? "&demo" : "") : "proveedores.html" + (provQ ? "?r=" + Date.now() + "#q=" + encodeURIComponent(provQ) : "")}"></iframe>`; provQ = "";
}
/* 🔎 "Buscar precio" desde 📝 Faltantes: salta a 💲 Proveedores con la búsqueda hecha */
let provQ = "";
window.addEventListener("message", e => {
  if(e.origin !== location.origin || !e.data || e.data.dabox !== "prov") return;
  provQ = String(e.data.q || "").slice(0, 120); $("#s-prov").innerHTML = ""; tab = "prov"; armarNav(); render();
});

/* =====================================================================
   3. EN VIVO — cada PC avisa a la planilla cada minuto (hoja Estado)
   ===================================================================== */
function rVivo(){
  const filas = D.vivo || [], sc = D.sinCierre || [];
  const alerta = sc.length ? `<div class="aviso" style="margin-bottom:14px"><span>🌙 <b>Ventas sin cierre:</b> ${sc.map(x => `${esc(sucNom(x[1]))} ${fechaAR(x[0])} · ${x[2]} ventas · ${money(x[3])}`).join(" · ")}.
    Se cierran desde la caja de esa sucursal con el botón 🌙 (no con el cierre normal).</span> <button class="link" id="vIrCierres" type="button">Ver en 💵 Cierres →</button></div>` : "";
  $("#s-vivo").innerHTML = alerta + `<p class="note">Cada caja abierta avisa cada minuto. Si una PC no avisa hace más de ${MIN_SEÑAL} min: está cerrada, sin internet o con la pestaña cerrada.</p>
  <div class="vivo">${SUCS.map(s => {
    const pcs = filas.filter(f => f[0] === s);
    const items = pcs.map(f => {
      const min = (Date.now() - f[5]) / 60000, activa = min <= MIN_SEÑAL;
      const est = !activa ? `<span class="pill">sin señal · ${hace(f[5])}</span>` : f[4] > 0 ? `<span class="pill warn">${f[4]} sin enviar</span>` : `<span class="pill ok">al día</span>`;
      return `<div class="pc"><div><b>${activa ? "🟢" : "⚪"} ${esc(f[2] || "—")}</b><span>${f[1] ? "PC "+esc(f[1])+" · " : ""}turno desde ${esc(f[3] || "—")}</span></div>${est}</div>`;
    }).join("") || `<div class="pc"><span>Todavía no se abrió la caja acá.</span></div>`;
    return `<div class="card"><h3>${sucTag(s)}</h3>${items}</div>`;
  }).join("")}</div>`;
}

/* =====================================================================
   4. VENTAS — por día, medio, sucursal y horario (solo ventas de DA BOX)
   ===================================================================== */
/* Ventas = lo vendido (la cta. cte. cuenta el día de la venta) · Ingresos = la plata que entró: sin ventas a cuenta + pagos de cta. cte. el día que se pagan */
let vModo = "ventas", vMedio = "todos";
const filasVentas = () => (vModo === "ventas" ? (D.dia || []) : [...(D.dia || []).filter(f => f[2] !== "ctacte"), ...(D.cobrosCC || [])])
  .filter(f => deSuc(f[1]) && (vMedio === "todos" || f[2] === vMedio));
function barraVentas(){
  const meds = Object.keys(MEDIOS).filter(k => vModo === "ventas" || k !== "ctacte");
  return `<div class="vbar"><span class="seg" id="vModo"><button data-m="ventas" aria-pressed="${vModo==="ventas"}">🧾 Ventas</button><button data-m="ingresos" aria-pressed="${vModo==="ingresos"}">💵 Ingresos</button></span>
    <span class="seg" id="vMedio"><button data-v="todos" aria-pressed="${vMedio==="todos"}">Todos</button>${meds.map(k => `<button data-v="${k}" aria-pressed="${vMedio===k}">${MEDIOS[k]}</button>`).join("")}</span></div>
    <p class="note">${vModo === "ventas" ? "<b>Ventas</b>: todo lo vendido; las ventas a cuenta corriente cuentan el día de la venta aunque todavía no se hayan pagado." : "<b>Ingresos</b>: la plata que entró. Sin las ventas a cuenta corriente y con los <b>pagos de cuenta corriente</b> el día que se cobraron."}</p>`;
}
function sinFacturarHTML(){
  const l = (D.sinFacturar || []).filter(x => deSuc(x[2])); if(!D.sinFacturar) return "";
  return `<div class="card"><h3>🧾 Ventas a cuenta sin facturar</h3><p class="note">Compras a cuenta corriente que todavía no tienen factura. Se marcan desde la caja (📒 → cliente → 🧾). ${l.length ? `${l.length} · ${money(l.reduce((a,x) => a + x[4], 0))}` : ""}</p>
    ${l.length ? `<div class="tw"><table><tr><th>Fecha</th><th>Sucursal</th><th>Cliente</th><th class="r">Monto</th><th class="r">Hace</th></tr>${l.slice(0,150).map(x => `<tr><td class="num">${fechaAR(x[1])}</td><td>${sucTag(x[2])}</td><td>${esc(x[3])}</td><td class="r">${money(x[4])}</td><td class="r m">${x[5] ? hace(x[5]) : ""}</td></tr>`).join("")}</table></div>` : `<div class="empty">🎉 Todo facturado.</div>`}</div>`;
}
$("#s-ventas").addEventListener("click", e => { const b = e.target.closest("#vModo button, #vMedio button"); if(!b) return;
  if(b.dataset.m){ vModo = b.dataset.m; if(vModo === "ingresos" && vMedio === "ctacte") vMedio = "todos"; } else vMedio = b.dataset.v; rVentas(); });
function rVentas(){
  const filas = filasVentas();
  if(!filas.length){ $("#s-ventas").innerHTML = `<div class="grid">${barraVentas()}<div class="card empty">🌱 No hay ${vModo === "ventas" ? "ventas" : "ingresos"} de DA BOX en este período${suc!=="TODAS" ? " para "+sucNom(suc) : ""}.</div>${sinFacturarHTML()}</div>`; return; }
  const cc = vModo === "ingresos" ? filas.filter(f => (D.cobrosCC || []).includes(f)).reduce((a,f) => a + f[4], 0) : 0;
  const total = filas.reduce((a,f) => a + f[4], 0), n = filas.reduce((a,f) => a + f[3], 0);
  const hoy = ymd(new Date()), fHoy = filas.filter(f => f[0] === hoy), tHoy = fHoy.reduce((a,f) => a + f[4], 0);
  const porDia = {}; filas.forEach(f => porDia[f[0]] = (porDia[f[0]] || 0) + f[4]);
  const diasConVenta = Object.keys(porDia).length;
  const porMedio = {efectivo:0, postnet:0, transf:0, ctacte:0}; filas.forEach(f => porMedio[f[2]] = (porMedio[f[2]] || 0) + f[4]);
  const porSuc = {}; filas.forEach(f => porSuc[f[1]] = (porSuc[f[1]] || 0) + f[4]);

  const V = vModo === "ventas";
  $("#s-ventas").innerHTML = `<div class="grid">${barraVentas()}
    <div class="tiles">
      <div class="tile"><span>${V ? "Vendido" : "Ingresó"} ${enPer()}</span><b>${millones(total)}</b><small>${money(total)}</small></div>
      <div class="tile"><span>${V ? "Ventas" : "Cobros"}</span><b>${n.toLocaleString("es-AR")}</b><small>${unDia() ? "en el día" : diasConVenta + " días con movimiento"}</small></div>
      ${V ? `<div class="tile"><span>Ticket promedio</span><b>${money(total/n)}</b><small>por venta</small></div>` : `<div class="tile"><span>Pagos de cta. cte.</span><b>${millones(cc)}</b><small>${money(cc)}</small></div>`}
      ${unDia() || rango ? "" : `<div class="tile"><span>Hoy</span><b>${millones(tHoy)}</b><small>${fHoy.reduce((a,f) => a + f[3], 0)} ${V ? "ventas" : "cobros"}</small></div>`}
    </div>
    <div class="card"${unDia() ? " hidden" : ""}><h3>${V ? "Venta" : "Ingresos"} por día</h3><p class="note">Total de cada día${suc!=="TODAS" ? " en "+sucNom(suc) : " (todas las sucursales)"}. Pasá el mouse por una barra para ver el detalle.</p>${chartDias(porDia)}</div>
    <div class="g2">
      <div class="card"><h3>Por medio de pago</h3><p class="note">Transferencias: se controlan con el banco.</p>${barras(Object.keys(MEDIOS).filter(k => V || k !== "ctacte").map(k => [MEDIOS[k], porMedio[k]]), total)}</div>
      ${suc === "TODAS" ? `<div class="card"><h3>Por sucursal</h3><p class="note">Parte de la venta total del período.</p>${barras(SUCS.map(s => [sucTag(s), porSuc[s]||0, SUC_COLOR[s]]), total, true)}</div>` : ""}
    </div>
    <div class="card"><h3>¿A qué hora se vende?</h3><p class="note">Monto vendido por día de la semana y hora (solo ventas${vMedio !== "todos" ? ", " + MEDIOS[vMedio] : ""}). Más oscuro = más venta. Sirve para armar horarios.</p>${mapaCalor()}</div>
    ${sinFacturarHTML()}
  </div>`;
}
function barras(items, total, html){
  const max = Math.max(...items.map(i => i[1]), 1);
  return `<div class="barras">${items.map(([l,v,c]) => `<div class="barra" data-tip="${esc(html ? "" : l)} ${money(v)} · ${pct(v,total)}"><span class="lab">${html ? l : esc(l)}</span>
    <span class="pista"><i style="width:${v/max*100}%;${c ? "background:"+c : ""}"></i></span><span class="val">${millones(v)}<small>${pct(v,total)}</small></span></div>`).join("")}</div>`;
}
function chartDias(porDia){
  const desde = D.r ? new Date(D.r[0] + "T12:00") : (d => (d.setHours(12,0,0,0), d.setDate(d.getDate() - dias + 1), d))(new Date()), fin = D.r ? D.r[1] : ymd(new Date());
  const lista = []; for(let d = new Date(desde); ymd(d) <= fin; d.setDate(d.getDate()+1)) lista.push(ymd(d));
  const W = 900, H = 200, PL = 56, PB = 22, max = Math.max(...lista.map(f => porDia[f] || 0), 1), paso = (W - PL) / lista.length, bw = Math.max(1.5, paso - 2);
  const y = v => H - PB - v / max * (H - PB - 8);
  const grid = [0, .5, 1].map(p => `<line class="grid-l" x1="${PL}" x2="${W}" y1="${y(max*p)}" y2="${y(max*p)}"/><text x="${PL-8}" y="${y(max*p)+4}" text-anchor="end">${millones(max*p)}</text>`).join("");
  const cada = Math.ceil(lista.length / 10);
  const cols = lista.map((f,i) => {
    const v = porDia[f] || 0, x = PL + i*paso + 1, d = new Date(f+"T12:00");
    const t = `<b>${DIAS_SEM[d.getDay()||7]} ${fechaAR(f)}</b><br>${money(v)}`;
    return `<g class="col" data-tip="${esc(t)}"><rect class="hit" x="${x-1}" y="0" width="${paso}" height="${H-PB}"/>${v ? `<rect class="mk" x="${x}" y="${y(v)}" width="${bw}" height="${H-PB-y(v)}" rx="${Math.min(3,bw/2)}" fill="var(--seq)"/>` : ""}
      ${i % cada === 0 ? `<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${f.slice(8)}/${f.slice(5,7)}</text>` : ""}</g>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Venta por día">${grid}${cols}</svg>`;
}
function mapaCalor(){
  const filas = (D.horas || []).filter(f => deSuc(f[0]) && (f[5] == null || ((vMedio === "todos" || f[5] === vMedio) && !(vModo === "ingresos" && f[5] === "ctacte"))));
  const m = {}; filas.forEach(f => { const k = f[1]+"|"+f[2]; m[k] = m[k] || [0,0]; m[k][0] += f[3]; m[k][1] += f[4]; });
  const horas = filas.map(f => f[2]), h0 = Math.min(8, ...horas), h1 = Math.max(20, ...horas);
  const max = Math.max(...Object.values(m).map(v => v[1]), 1), cols = h1 - h0 + 1;
  let html = `<div class="calor" style="grid-template-columns:40px repeat(${cols}, minmax(26px,1fr))"><span></span>`;
  for(let h = h0; h <= h1; h++) html += `<span class="h">${h}</span>`;
  for(let d = 1; d <= 7; d++){
    html += `<span class="d">${DIAS_SEM[d]}</span>`;
    for(let h = h0; h <= h1; h++){
      const v = m[d+"|"+h];
      html += `<span class="c" data-tip="${esc(`<b>${DIAS_SEM[d]} ${h} a ${h+1} h</b><br>${v ? money(v[1]) + " · " + v[0] + " ventas" : "sin ventas"}`)}">${v ? `<i style="opacity:${(.12 + .88 * v[1]/max).toFixed(2)}"></i>` : ""}</span>`;
    }
  }
  return html + `</div>`;
}

/* =====================================================================
   5. MESES — GUARDABLE (hasta que DA BOX lo reemplace) + cierres de DA BOX
   ===================================================================== */
function rMensual(){
  const filas = (D.mensual || []).filter(f => deSuc(f[1]));
  if(!filas.length){ $("#s-mensual").innerHTML = `<div class="card empty">📅 Todavía no hay datos mensuales. Cargá la hoja <b>Historico</b> en la planilla.</div>`; return; }
  const meses = [...new Set(filas.map(f => f[0]))].sort().slice(-13), mesActual = ymd(new Date()).slice(0,7);
  const val = (m,s) => (filas.find(f => f[0]===m && f[1]===s) || [])[2] || 0;
  const tot = m => filas.filter(f => f[0]===m).reduce((a,f) => a + f[2], 0);
  const sucs = suc === "TODAS" ? SUCS : [suc];
  const origen = m => [...new Set(filas.filter(f => f[0]===m).map(f => f[7]))].join(" + ");

  // barras apiladas: una columna por mes, un tramo por sucursal (separados 2px)
  const W = 900, H = 260, PL = 56, PB = 24, max = Math.max(...meses.map(tot), 1), paso = (W-PL)/meses.length, bw = Math.min(46, paso*.62);
  const y = v => H - PB - v / max * (H - PB - 10);
  const grid = [0,.25,.5,.75,1].map(p => `<line class="grid-l" x1="${PL}" x2="${W}" y1="${y(max*p)}" y2="${y(max*p)}"/><text x="${PL-8}" y="${y(max*p)+4}" text-anchor="end">${millones(max*p)}</text>`).join("");
  const cols = meses.map((m,i) => {
    const x = PL + i*paso + (paso-bw)/2; let base = 0, segs = "";
    const partes = sucs.map(s => [s, val(m,s)]).filter(p => p[1] > 0);
    partes.forEach(([s,v], j) => {
      const y1 = y(base + v), y0 = y(base), h = Math.max(0, y0 - y1 - (j ? 2 : 0));
      segs += `<rect x="${x}" y="${y1}" width="${bw}" height="${h}" rx="${j === partes.length-1 ? 3 : 0}" fill="${SUC_COLOR[s]}"/>`; base += v;
    });
    const t = `<b>${mesTxt(m)}${m===mesActual ? " (en curso)" : ""}</b><br>` + partes.map(([s,v]) => `${sucNom(s)}: ${money(v)}`).join("<br>") + (partes.length > 1 ? `<br><b>Total: ${money(base)}</b>` : "");
    return `<g class="col" data-tip="${esc(t)}"><rect class="hit" x="${PL+i*paso}" y="0" width="${paso}" height="${H-PB}"/>${segs}
      <text x="${x+bw/2}" y="${H-6}" text-anchor="middle"${m===mesActual ? ' font-style="italic"' : ""}>${mesTxt(m)}${m===mesActual ? "*" : ""}</text></g>`;
  }).join("");
  const ley = sucs.length > 1 ? `<div class="leyenda">${sucs.map(s => `<span><i class="dot" style="background:${SUC_COLOR[s]}"></i>${sucNom(s)}</span>`).join("")}<span>* mes en curso</span></div>` : `<div class="leyenda"><span>* mes en curso</span></div>`;

  // tabla (también es la versión accesible del gráfico)
  const filasT = [...meses].reverse().map((m,i,arr) => {
    const t = sucs.reduce((a,s) => a + val(m,s), 0), prev = arr[i+1] ? sucs.reduce((a,s) => a + val(arr[i+1],s), 0) : 0;
    const v = prev && m !== mesActual ? (t/prev - 1) * 100 : null;
    return `<tr><td>${mesTxt(m)}${m===mesActual ? ' <span class="pill">en curso</span>' : ""}</td>${sucs.length > 1 ? sucs.map(s => `<td class="r">${money(val(m,s))}</td>`).join("") : ""}
      <td class="r"><b>${money(t)}</b></td><td class="r ${v==null ? "dif-nc" : v >= 0 ? "dif-ok" : "dif-mal"}">${v==null ? "—" : (v>0?"+":"") + v.toFixed(1) + "%"}</td><td class="m">${esc(origen(m))}</td></tr>`;
  }).join("");
  $("#s-mensual").innerHTML = `<div class="grid">
    <div class="card"><h3>Venta mensual${suc!=="TODAS" ? " · "+sucNom(suc) : " por sucursal"}</h3><p class="note">Pesos de cada mes, sin ajustar por inflación. Cada día se toma del GUARDABLE si está cargado; si no, de los cierres de DA BOX.</p>
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Venta mensual">${grid}${cols}</svg>${ley}</div>
    <div class="card"><h3>Detalle</h3><p class="note">Variación contra el mes anterior (el mes en curso no se compara).</p>
      <div class="tw"><table><tr><th>Mes</th>${sucs.length > 1 ? sucs.map(s => `<th class="r">${sucTag(s)}</th>`).join("") : ""}<th class="r">Total</th><th class="r">vs. mes anterior</th><th>Datos</th></tr>${filasT}</table></div></div>
  </div>`;
}

/* =====================================================================
   6. CIERRES — diferencias de caja (DA BOX: efectivo y postnet · GUARDABLE: caja contra Don Gestión)
   ===================================================================== */
let soloDif = true;
function rCierres(){
  const todos = (D.cierres || []).filter(c => deSuc(c[1]));
  const conDif = c => Math.abs(c[4] || 0) >= DIF_MINIMA || Math.abs(c[5] || 0) >= DIF_MINIMA;
  const lista = soloDif ? todos.filter(c => conDif(c) || (c[10] === "DA BOX" && (c[8] || 1) > 1)) : todos;
  const corr = c => c[10] === "DA BOX" ? Math.max(0, (c[8] || 1) - 1) : 0;          // veces que tocó "Corregir" antes de cerrar
  const primero = c => c[11] != null && Math.abs(c[11] - (c[4] || 0)) >= 1 ? c[11] : null;   // diferencia del 1er conteo, si cambió
  const porCaj = {}; todos.forEach(c => { const k = c[2] || "—"; porCaj[k] = porCaj[k] || [0,0,0,0,0]; porCaj[k][0]++; if(conDif(c)){ porCaj[k][1]++; porCaj[k][2] += (c[4]||0) + (c[5]||0); }
    if(corr(c)){ porCaj[k][3]++; porCaj[k][4] += corr(c); } });
  const dif = d => d == null ? `<span class="dif-nc">—</span>` : Math.abs(d) < DIF_MINIMA ? `<span class="dif-ok">${Math.round(d) ? (d < 0 ? "−" : "+") + money(Math.abs(d)).slice(1) : "OK"}</span>` : `<span class="dif-mal">${d > 0 ? "sobra " : "falta "}${money(Math.abs(d))}</span>`;
  const difTxtP = d => Math.round(d) === 0 ? "OK" : (d > 0 ? "sobraba " : "faltaba ") + money(Math.abs(d));
  const fecha = ts => { const d = new Date(ts); return `${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  $("#s-cierres").innerHTML = `<div class="grid">
    <div class="tiles">
      <div class="tile"><span>Cierres ${enPer()}</span><b>${todos.length}</b></div>
      <div class="tile"><span>Con diferencia ≥ ${money(DIF_MINIMA)}</span><b>${todos.filter(conDif).length}</b><small>${pct(todos.filter(conDif).length, todos.length)} de los cierres</small></div>
      <div class="tile"><span>Suma de diferencias</span>${(() => { const t = todos.filter(conDif).reduce((a,c) => a + (c[4]||0) + (c[5]||0), 0); return `<b class="${t < 0 ? "dif-mal" : ""}">${t < 0 ? "falta " : t > 0 ? "sobra " : ""}${money(Math.abs(t))}</b><small>faltantes y sobrantes sumados</small>`; })()}</div>
    </div>
    ${(() => { const sc = (D.sinCierre || []).filter(x => deSuc(x[1])); if(!sc.length) return "";
      const hh = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
      return `<div class="card" style="border-color:var(--warn)"><h3>🌙 Ventas sin cierre</h3>
      <p class="note">Ventas que no entraron en ningún cierre: alguien vendió después de cerrar y no hizo el cierre chico. La plata tendría que estar en la caja. Si la caja las cierra al día siguiente (aviso al abrir turno), desaparecen de acá.</p>
      <div class="tw"><table><tr><th>Día</th><th>Sucursal</th><th class="r">Ventas</th><th class="r">Monto</th><th>Horario</th><th>Cobró</th></tr>
      ${sc.map(x => `<tr><td class="num">${fechaAR(x[0])}</td><td>${sucTag(x[1])}</td><td class="r">${x[2]}</td><td class="r"><b>${money(x[3])}</b></td><td class="num">${hh(x[4])}${x[5] !== x[4] ? "–" + hh(x[5]) : ""}</td><td>${esc((x[6] || []).join(", "))}</td></tr>`).join("")}</table></div></div>`; })()}
    <div class="card"><h3>Por cajero</h3><p class="note">Cuántos cierres hizo cada uno, cuántos tuvieron diferencia y en cuántos <b>corrigió el conteo</b> (tocó "Corregir" después de ver el resultado). Corregir está bien si contó mal un billete; muchas correcciones seguidas = revisar cómo cuenta.</p>
      <div class="tw"><table><tr><th>Cajero</th><th class="r">Cierres</th><th class="r">Con diferencia</th><th class="r">Suma</th><th class="r">Corrigió</th></tr>
      ${Object.entries(porCaj).sort((a,b) => b[1][1]-a[1][1] || b[1][0]-a[1][0]).map(([k,v]) => `<tr><td>${esc(k)}</td><td class="r">${v[0]}</td><td class="r">${v[1]} <span class="m">(${pct(v[1],v[0])})</span></td><td class="r">${v[1] ? dif(v[2]) : "—"}</td><td class="r">${v[3] ? `<span class="${v[3]/v[0] >= .3 ? "dif-mal" : ""}">${v[3]} cierre${v[3] > 1 ? "s" : ""}</span> <span class="m">(${v[4]} ${v[4] > 1 ? "veces" : "vez"})</span>` : "—"}</td></tr>`).join("")}</table></div></div>
    <div class="card"><h3><span>Cierres</span><label class="check"><input type="checkbox" id="cSolo" ${soloDif ? "checked" : ""}> Solo con diferencia o corrección</label></h3>

const csvFilas = t => { const out = []; let f = [], c = "", q = false;

function leerBanco(t){
  const out = [];
  t.split(/\r?\n/).forEach(l => { const r = l.split(";"); if(r.length < 11 || !/^\d{4}-\d{2}-\d{2}$/.test(r[4])) return;
    const s = r[5].trim(), imp = (s.endsWith("-") ? -1 : 1) * Number(s.replace(/-$/, "").replace(",", ".")), cod = r[8].trim(), con = r[9].trim(), det = r[10].replace(/\s+$/, "");
    const pct = /PCT/.test(det.slice(31, 40));
    const tipo = imp > 0 && (cod === "480" || cod === "071" || (cod === "413" && !pct)) ? "Transferencia" : cod === "413" && pct ? "QR" : cod === "561" ? "Tarjetas"
      : ["056","058","473"].includes(cod) ? "Impuesto" : cod === "946" ? "Comisión" : imp < 0 ? "Salida" : "Otro";
    let real = ""; if(tipo === "Transferencia"){ const m = det.match(/(\d{2})(\d{2})(20\d{2})(\d{2})(\d{2})(\d{2})/); if(m && +m[1] <= 31 && +m[2] <= 12 && +m[4] < 24 && +m[5] < 60) real = `${m[3]}-${m[2]}-${m[1]} ${m[4]}:${m[5]}:${m[6]}`; 
      if(cod === "071"){ const d = det.match(/^(\d{2})(\d{2})/); if(d && +d[1] >= 1 && +d[1] <= 31 && +d[2] >= 1 && +d[2] <= 12){ const y = +r[4].slice(0, 4) - (+d[2] > +r[4].slice(5, 7) ? 1 : 0); real = `${y}-${d[2]}-${d[1]}`; } } }   // DEBIN: solo trae el día (ddmm…)
    const nom = cod === "071" ? "DEBIN" : det.slice(0, 20).trim(), cuit = (det.slice(20, 31).match(/\d{8,11}/) || (cod === "071" ? det.match(/\s(\d{11})\b/) : null) || ["", ""])[cod === "071" ? 1 : 0] || "";
    out.push([r[4], Math.round(imp * 100) / 100, cod, con, det.slice(0, 120), real, nom, cuit, tipo, [r[4], s, cod, r[7].trim(), det.slice(0, 60).trim()].join("|")]); });
  return out;
}
function tipoArchivo(nombre, t){
  if(/^\d+;\d{4};\d{3};\d+;\d{4}-\d{2}-\d{2};/m.test(t.slice(0, 400))) return "banco";
  const h = t.slice(0, 2000).toUpperCase();
  if(h.includes("QR ID") && h.includes("MONTO NETO") && h.includes("NRO CUPON")) return "tq";
  if(h.includes("QR ID") && h.includes("MEDIO DE PAGO")) return "qr";
  if(h.includes("TOTAL_BRUTO") && h.includes("TOTAL_NETO")) return "liq";
  if(h.includes("LOTE") && /MONTO/.test(h)) return "mov";
  return "";
}
async function leerCarga(files){

    const tipo = tipoArchivo(f.name, t);

/* =====================================================================
   6c. SOBRES — el retiro de cada cierre va en un sobre; el encargado lo cuenta acá (hoja Conteos).
       Diferencia = retiro − extracción − contado (+ falta · − sobra). Extracción = pago hecho con plata del sobre.
       Se cuenta de nuevo para corregir (vale el último) y ↩ lo vuelve a "sin contar". Nada se borra.
   ===================================================================== */
const DESTINOS = ["Juani","Reserva"];
const MOTIVOS = ["Billete falso","Error de conteo","Error de tipeo","Pago o transferencia","Faltante sin explicar","Otro"];
const DIAS_DEMORA = 3;                                       // un sobre sin contar hace más días que esto se marca en rojo
const toNum = s => Number(String(s ?? "").replace(/[^\d]/g,"")) || 0;
/* Contado con cuentas: "20000x7 + 10000x3 + 2000x15" o "140.000 + 30000". Solo números, +, x (o ×, *). Nada se ejecuta como código.
   Devuelve el total, o null si hay algo que no entiende. */
function evalConteo(t){
  const partes = String(t ?? "").split("+").map(x => x.trim()).filter(Boolean); if(!partes.length) return null;
  let tot = 0;
  for(const p of partes){ const m = p.match(/^\$?\s*([\d.,]+)\s*(?:[x×*]\s*(\d+))?$/i); if(!m) return null; tot += toNum(m[1]) * (m[2] ? +m[2] : 1); }
  return tot;
}
/* v2.9: el Contado se ve en pesos mientras se escribe: "150000+19000" → "$ 150.000 + $ 19.000". Solo al agregar (borrar no reformatea) */
function fmtConteo(t){
  return String(t ?? "").split("+").map((p, i, a) => {
    const m = p.match(/^\s*\$?\s*([\d.,]*)\s*(?:([x×*])\s*(\d*))?\s*$/i);

  }).join(" + ").replace(/\s+$/, "") + (/\+\s*$/.test(t) ? " " : "");
}
function billetesTxt(t){   // "20000x3 500x0.13" → "$ 20.000 × 3 · ⚠️ $ 500 × 0.13"
  return String(t).split(/\s+/).filter(Boolean).map(b => { const m = b.match(/^(\d+)x(.+)$/); if(!m) return esc(b);
    const raro = !/^\d+$/.test(m[2]); return `${raro ? '<span class="dif-mal" title="Cantidad de billetes no entera">⚠️ ' : ""}${money(+m[1])} × ${esc(m[2])}${raro ? "</span>" : ""}`; }).join(" · ");
}
const esCuenta = t => /[+x×*]/i.test(String(t || ""));
const fechaHM = ts => { const d = new Date(ts); return `${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const difSobre = d => !d ? `<span class="dif-ok">OK</span>` : `<span class="${Math.abs(d) >= DIF_MINIMA ? "dif-mal" : "dif-nc"}">${d > 0 ? "falta " : "sobra "}${money(Math.abs(d))}</span>`;
let sbAbierto = null, sbDest = "Juani", sbEnvio = false, sbArmado = null;
// sobre: [id, ts cierre, sucursal, cajero, retiro, conteo] · conteo: null o [ts, extracción, concepto, contado, diferencia, motivo, destino, obs]
function rSobres(){
  const todos = (D.sobres || []).filter(s => deSuc(s[2]));

      <td class="r">${money(c[3])}</td><td class="r">${difSobre(c[4])}</td><td class="m">${esc([c[5], c[7]].filter(Boolean).join(" · "))}${c[4] && (s[6] || c[8]) ? `<br><span title="Para buscar el error billete por billete">🧾 Cajero: ${esc(s[6] || "—")}<br>🖐️ Vos: ${esc(c[8] || money(c[3]))}</span>` : ""}</td>
      <td><span class="pill">${esc(c[6])}</span></td><td class="m num">${fechaHM(c[0])}</td>

      <div class="tile"><span>A Juani este mes</span><b>${millones(aDest("Juani"))}</b><small>${money(aDest("Juani"))}</small></div>
      <div class="tile"><span>A Reserva este mes</span><b>${millones(aDest("Reserva"))}</b><small>${money(aDest("Reserva"))}</small></div>
      <div class="tile"><span>Diferencias del mes</span><b class="${Math.abs(difMes) >= DIF_MINIMA ? "dif-mal" : ""}">${difMes > 0 ? "falta " : difMes < 0 ? "sobra " : ""}${money(Math.abs(difMes))}</b><small>${conDifMes} de ${delMes.length} sobres con diferencia</small></div>
    </div>
    <div class="card"><h3><span>Sin contar</span><span class="seg" id="sbDest" aria-label="Destino de la plata">${DESTINOS.map(d => `<button data-d="${d}" aria-pressed="${d===sbDest}">→ ${d}</button>`).join("")}</span></h3>
      <p class="note">Contá el sobre. Si hay justo lo que dice, tocá <b>✓ Coincide</b> (va a ${esc(sbDest)}; cambialo arriba). Si no, <b>✏️ Otro monto</b>: la diferencia sale sola. Si pagaste algo con esa plata, anotalo en <b>Extracción</b>.</p>
      ${pend.length ? `<div class="tw"><table><tr><th>Cierre</th><th>Sucursal</th><th>Cajero</th><th class="r">Retiro</th><th></th></tr>${pend.map(filaPend).join("")}</table></div>`
        : `<div class="empty">🎉 No hay sobres para contar${suc !== "TODAS" ? " en " + sucNom(suc) : ""}.</div>`}</div>
    <div class="card"><h3>Contados</h3><p class="note">Últimos ${Math.min(hechos.length, 200)}. <b>Falta</b>: había menos plata que el retiro (menos lo extraído). <b>Sobra</b>: había más. ↩ lo vuelve a "sin contar" para contarlo de nuevo.</p>

        : `<div class="empty">Todavía no contaste ningún sobre.</div>`}</div>
  </div>`;
  if(sbAbierto){ const i = $("#sbCont"); if(i){ i.focus(); i.select(); } difForm(); }

function formSobre(s){

function difForm(){

async function contarSobre(id, datos){
  if(sbEnvio) return; sbEnvio = true; LA.toast("Guardando…", 20000);
  try{
    if(LA.demo){                                              // datos de prueba: solo cambia en pantalla
      const s = D.sobres.find(x => x[0] === id);
      s[5] = datos.deshacer ? null : [Date.now(), datos.extraccion, datos.concepto, datos.contado, s[4] - datos.extraccion - datos.contado, datos.motivo, datos.destino, datos.obs, datos.detalle || ""];
    } else D.sobres = (await LA.api("sobre-contar", {id, ...datos, _sinReintento:1})).sobres;
    sbAbierto = null; sbArmado = null;
    LA.toast(datos.deshacer ? "↩ Sobre de nuevo sin contar" : "💰 Sobre guardado");
  }catch(e){
    if(e === "clave"){ LA.salir(LA.ERR.clave); return; }
    LA.toast("❌ " + ((e && e.msg) || LA.ERR[e] || "No se pudo guardar"), 6000);
  }finally{ sbEnvio = false; if(tab === "sobres") rSobres(); }
}
$("#s-sobres").addEventListener("click", e => {

$("#s-sobres").addEventListener("input", e => {

sbDest = DESTINOS.includes(leerLS("sbDest", "")) ? leerLS("sbDest", "") : "Juani";

/* =====================================================================
   6d. CONTROL — 🔍 por cajero (solo Encargado; el script no lo manda a otros roles).
       Avisa, no acusa: 🔴 = "Revisar". Anulaciones · cambios de medio · genéricos (Librería, Varios, Kiosco) · transferencias sin banco.

const BANDERAS = {"efectivo":"💵 era efectivo", "tarde":"⏱ anulada tarde", "post-cierre":"🔒 después del cierre", "otra-pc":"👥 la anuló otro",
                  "efe→otro":"💵→ salió de efectivo", "genérico alto":"📦 genéricos altos"};
const medioTxt = m => MEDIOS[m] || MEDIOS[{"Efectivo":"efectivo","Postnet / QR":"postnet","Transferencia":"transf","Cta. cte.":"ctacte"}[m]] || esc(m || "—");
const bandTxt = b => (b || []).map(x => `<span class="pill bad">${esc(BANDERAS[x] || x)}</span>`).join(" ");
let ctSolo = true, ctCajero = null;
/* control: {anulaciones:[tsVenta, tsAnul, suc, cajero venta, quién anuló, medio, total, venta N°, banderas[]],
             cambiosMedio:[ts, suc, cajero, medio original, medio actual, total, banderas[]],
             genericos:[cajero, suc, ventas $, genéricos $, % genéricos, % promedio suc, ventas solo-genérico, banderas[]],
             transfSinBanco:[cajero, suc, cant, $]} */
function ctDatos(){
  const C = D.control || {}, f = x => deSuc(x);
  const an = (C.anulaciones || []).filter(x => f(x[2])), cm = (C.cambiosMedio || []).filter(x => f(x[1])),
        gen = (C.genericos || []).filter(x => f(x[1])), tr = (C.transfSinBanco || []).filter(x => f(x[1]));
  const quien = x => x[4] && x[4] !== "?" ? x[4] : x[3];                       // anulación: cuenta para quien la hizo (caja vieja: el de la venta)
  const P = {}, per = k => P[k] || (P[k] = {k, ventas:0, an:[], cm:[], gen:[], tr:[0,0], rojo:0});
  gen.forEach(x => { const p = per(x[0]); p.ventas += x[2]; p.gen.push(x); if((x[7] || []).length) p.rojo++; });
  an.forEach(x => { const p = per(quien(x)); p.an.push(x); if((x[8] || []).length) p.rojo++; });
  cm.forEach(x => { const p = per(x[2]); p.cm.push(x); if((x[6] || []).length) p.rojo++; });
  tr.forEach(x => { const p = per(x[0]); p.tr[0] += x[2]; p.tr[1] += x[3]; if(x[2]) p.rojo++; });
  return {an, cm, gen, tr, per: Object.values(P).sort((a, b) => b.rojo - a.rojo || a.k.localeCompare(b.k))};
}
function rControl(){

$("#s-control").addEventListener("click", e => {

/* "4500*2,13" "4500x2.13" "+10%" "-5%" "12.500" → número (o null si no se entiende). Solo números y * x + - % : no se ejecuta nada como código */
function prEval(t, actual){

async function prGuardar(i){

/* 💡 SUGERIDO DE PROVEEDORES: al elegir un producto (foco en el precio nuevo) aparecen los 3 más parecidos de las listas.

const pvIDB = (modo, val) => new Promise(ok => { try{ const r = indexedDB.open("dabox-prov", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv");
